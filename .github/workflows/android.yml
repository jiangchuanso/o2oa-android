name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create debug keystore
      run: |
        mkdir -p app
        rm -f app/debug.keystore
        keytool -genkeypair -v -storetype PKCS12 -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Download Gradle Wrapper
      run: |
        curl -sLo gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v6.5.0/gradle/wrapper/gradle-wrapper.jar"

    - name: Setup Android SDK
      run: |
        echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platforms;android-31" "build-tools;30.0.3" || \
        echo "y" | sudo $ANDROID_HOME/tools/bin/sdkmanager --install "platforms;android-31" "build-tools;30.0.3" || true
        rm -rf $ANDROID_HOME/.repo || true

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        echo "signingConfig.keyAlias=androiddebugkey" >> local.properties
        echo "signingConfig.keyPassword=android" >> local.properties
        echo "signingConfig.storeFilePath=debug.keystore" >> local.properties
        echo "signingConfig.storePassword=android" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/*/debug/*.apk
